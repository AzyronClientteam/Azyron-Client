plugins {
	id 'fabric-loom' version '1.14.10'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Compile native adapters and mixins against the selected target, never against
// a synthetic union of APIs. Optimization/features remain in shared main sources.
def mcTarget = project.minecraft_version.toString()
if (!(mcTarget in ['1.20.1', '1.21.11'])) {
    throw new GradleException("Unsupported Minecraft target: ${mcTarget}")
}
def legacyTarget = mcTarget == '1.20.1'
def modernOnlyMixins = ['ChunkBatchSizeCalculatorMixin', 'GameRendererMixin',
        'InGameHudMixin', 'MouseMixin', 'PersistentStateManagerMixin',
        'RealmsAvailabilityMixin', 'Screen121Mixin', 'EntityRenderManagerMixin']
sourceSets.main.java.srcDir(legacyTarget ? 'src/mc1201/java' : 'src/mc12111/java')
sourceSets.main.java.exclude { entry ->
    def name = entry.file.name.replace('.java', '')
    legacyTarget ? modernOnlyMixins.contains(name) : name.endsWith('120Mixin')
}

repositories {
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version
    inputs.property "minecraftTarget", mcTarget

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}

	doLast {
		def fmj = file("${destinationDir}/fabric.mod.json")
		if (fmj.exists() && fmj.text.contains('${')) {
			throw new GradleException("Unexpanded placeholder remaining in fabric.mod.json")
		}
        def metadata = new groovy.json.JsonSlurper().parse(fmj)
        metadata.depends.minecraft = [mcTarget]
        metadata.depends.java = legacyTarget ? '>=17' : '>=21'
        metadata.name = 'Azyron Client v1.0.3'
        fmj.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)) + '\n'
        def mixinFile = file("${destinationDir}/azyron-client.mixins.json")
        def config = new groovy.json.JsonSlurper().parse(mixinFile)
        config.client.add('EntityRenderDispatcher120Mixin')
        ['mixins', 'client'].each { key ->
            config[key] = config[key].findAll { name ->
                legacyTarget ? !modernOnlyMixins.contains(name) : !name.endsWith('120Mixin')
            }
        }
        // Loom's Mixin extension remaps annotation targets directly; no legacy AP refmap is generated.
        config.remove('refmap')
        mixinFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config)) + '\n'

	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = legacyTarget ? 17 : 21
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ["-Xmaxerrs", "1000"]
}

java {
	withSourcesJar()

	sourceCompatibility = legacyTarget ? JavaVersion.VERSION_17 : JavaVersion.VERSION_21
	targetCompatibility = legacyTarget ? JavaVersion.VERSION_17 : JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

// Distinct files prevent accidental cross-version replacement.
tasks.named('remapJar') {
    archiveFileName = "Azyron-Client-${project.version}-mc${mcTarget}.jar"
}
