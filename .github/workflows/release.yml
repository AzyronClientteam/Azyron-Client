name: Build and attach PojavLauncher APK

on:
  workflow_dispatch:
    inputs:
      apk_variant:
        description: 'Debug APK needs no private signing secret; full release requires configured signing.'
        type: choice
        options:
          - debug-noruntime
          - signed-full-release
        default: debug-noruntime
        required: true

permissions:
  contents: write

concurrency:
  group: azyron-existing-release-437365942
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'AzyronClientteam/Azyron-Client' && github.ref == 'refs/heads/arena/a6dbb848-azyron-client'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      POJAV_KEYSTORE_PASSWORD: ${{ secrets.POJAV_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout launcher and native submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Guard existing public release and signing requirements
        env:
          APK_VARIANT: ${{ inputs.apk_variant }}
        run: |
          set -euo pipefail
          gh api repos/AzyronClientteam/Azyron-Client/releases/437365942 > /tmp/release.json
          python3 - <<'PY'
          import json, os
          release = json.load(open('/tmp/release.json'))
          assert release['id'] == 437365942 and release['tag_name'] == 'v1.0.3'
          assert release['draft'] is False, 'Expected the owner-approved public release'
          if os.environ['APK_VARIANT'] == 'signed-full-release' and not os.environ.get('POJAV_KEYSTORE_PASSWORD'):
              raise RuntimeError('POJAV_KEYSTORE_PASSWORD is not configured; cannot build a production-signed APK')
          PY
      - name: Get LTW renderer
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs
      - name: Get Mesa renderer
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.MESA_ACTIONS || github.token }}
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_pojavlauncher/libs
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build actual APK
        env:
          APK_VARIANT: ${{ inputs.apk_variant }}
        run: |
          set -euo pipefail
          mkdir -p out
          if [[ "$APK_VARIANT" == "signed-full-release" ]]; then
            gradle :app_pojavlauncher:assembleFullRelease --stacktrace
            cp app_pojavlauncher/build/outputs/apk/full/release/app_pojavlauncher-full-release.apk out/PojavLauncher-full-release.apk
          else
            gradle :app_pojavlauncher:assembleNoruntimeDebug --stacktrace
            cp app_pojavlauncher/build/outputs/apk/noruntime/debug/app_pojavlauncher-noruntime-debug.apk out/PojavLauncher-noruntime-debug.apk
          fi
      - name: Validate Android package and signature
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          apk, = Path('out').glob('*.apk')
          assert apk.stat().st_size > 1024 * 1024, 'APK unexpectedly small'
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              assert 'AndroidManifest.xml' in z.namelist()
              assert 'classes.dex' in z.namelist()
              assert any(n.startswith('lib/') and n.endswith('.so') for n in z.namelist())
          PY
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$signer"
          "$signer" verify --verbose out/*.apk
          (cd out && sha256sum *.apk > APK-SHA256SUMS.txt)
      - name: Upload APK and verify exact public download bytes
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import traceback
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          def failure(kind, value, tb):
              message = f"{kind.__name__}: {value}".replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=APK attachment failure::{message}', flush=True)
              traceback.print_exception(kind, value, tb)
          sys.excepthook = failure
          repo = 'AzyronClientteam/Azyron-Client'
          release_id = 437365942
          def api(endpoint):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{endpoint}']))
          def guard():
              r = api(f'releases/{release_id}')
              if r['tag_name'] != 'v1.0.3' or r['draft'] is not False:
                  raise RuntimeError('Release identity/publication guard failed')
          guard()
          for path in sorted(Path('out').iterdir()):
              if path.suffix != '.apk' and path.name != 'APK-SHA256SUMS.txt':
                  continue
              raw = path.read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              existing = [a for a in api(f'releases/{release_id}/assets?per_page=100') if a['name'] == path.name]
              if not existing:
                  guard()
                  url = f'https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?' + urlencode({'name': path.name})
                  request = Request(url, data=raw, method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Content-Type': 'application/octet-stream',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
                  try:
                      with urlopen(request, timeout=180) as response:
                          assert response.status == 201
                          asset = json.load(response)
                  except HTTPError as error:
                      raise RuntimeError(f'Upload HTTP {error.code}: {error.read().decode(errors="replace")}') from error
              else:
                  asset, = existing
              assert asset['state'] == 'uploaded' and asset['size'] == len(raw)
              if asset.get('digest'):
                  assert asset['digest'] == 'sha256:' + digest
              url = asset['browser_download_url']
              assert url == f'https://github.com/{repo}/releases/download/v1.0.3/{path.name}'
              with urlopen(Request(url, headers={'User-Agent': 'AZYRON-release-verifier'}), timeout=180) as response:
                  assert response.status == 200
                  assert hashlib.sha256(response.read()).hexdigest() == digest
              print(f'VERIFIED {path.name}: {url} SHA-256 {digest}', flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f'- [{path.name}]({url}) — SHA-256 `{digest}`\n')
          guard()
      - name: Preserve APK build output
        uses: actions/upload-artifact@v4
        with:
          name: verified-launcher-apk
          path: out/
          if-no-files-found: error
