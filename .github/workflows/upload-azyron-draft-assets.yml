# Upload/verify assets on the owner-approved existing PUBLIC versioned release.
# Release metadata/tag changes are made explicitly, not implicitly by this workflow.
# Artifacts are compiled locally against stubs; actual game-launch compatibility is unverified.
name: Verify public AZYRON release assets

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: azyron-existing-release-437365942
  cancel-in-progress: false

jobs:
  upload-and-verify:
    if: github.repository == 'AzyronClientteam/Azyron-Client' && github.ref == 'refs/heads/arena/a6dbb848-azyron-client'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout only the approved workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore files, guard versioned public release, and verify anonymous downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import sys
          import traceback

          def report_failure(kind, value, tb):
              message = f"{kind.__name__}: {value}"
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Exact upload failure::{message}", flush=True)
              traceback.print_exception(kind, value, tb)

          sys.excepthook = report_failure

          import base64
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import struct
          import subprocess
          import tempfile
          import time
          import zipfile
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          REPO = "AzyronClientteam/Azyron-Client"
          TAG = "v1.0.3"
          RELEASE_ID = 437365942
          EXPECTED = {'Azyron-Client-1.0.3.jar': {'sha256': 'ffcf394824b934c3ac44dce736e698c2688f27c66654a0c1fc8c66af855548da', 'size': 209374}, 'Azyron-Modpack-1.0.3.mrpack': {'sha256': '7621755721089e2f0940004e592aa4205a40078ad2ccfd9f9c5c19fe1b8606ee', 'size': 208140}}

          def gh(*args):
              proc = subprocess.run(["gh", *args], capture_output=True, text=True, timeout=120)
              if proc.returncode:
                  raise RuntimeError(f"gh {' '.join(args)} failed ({proc.returncode}): {proc.stderr.strip()}")
              return proc.stdout

          def release():
              data = json.loads(gh("api", f"repos/{REPO}/releases/{RELEASE_ID}"))
              if data["id"] != RELEASE_ID or data["tag_name"] != TAG or data["draft"] is not False:
                  raise RuntimeError("Release ID/tag/public guard failed. No upload permitted.")
              data["assets"] = json.loads(gh("api", f"repos/{REPO}/releases/{RELEASE_ID}/assets?per_page=100"))
              return data

          def upload_exact(path):
              # Do not use gh release upload TAG: a different release can resolve
              # from the same tag. POST only to the approved numeric release ID.
              release()
              url = f"https://uploads.github.com/repos/{REPO}/releases/{RELEASE_ID}/assets?" + urlencode({"name": path.name})
              request = Request(url, data=path.read_bytes(), method="POST", headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/octet-stream",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with urlopen(request, timeout=120) as response:
                      if response.status != 201:
                          raise RuntimeError(f"Unexpected upload HTTP status: {response.status}")
                      return json.load(response)
              except HTTPError as error:
                  raise RuntimeError(f"Exact-ID upload HTTP {error.code}: {error.read().decode(errors='replace')}") from error

          def download_exact(asset):
              # gh api follows asset redirects safely and keeps token out of logs.
              endpoint = f"repos/{REPO}/releases/assets/{asset['id']}"
              proc = subprocess.run(["gh", "api", endpoint, "-H", "Accept: application/octet-stream"], capture_output=True, timeout=120)
              if proc.returncode:
                  raise RuntimeError(proc.stderr.decode(errors="replace"))
              return proc.stdout

          def check_bytes(name, data):
              spec = EXPECTED[name]
              if len(data) != spec["size"] or hashlib.sha256(data).hexdigest() != spec["sha256"]:
                  raise RuntimeError(f"Size/SHA-256 mismatch: {name}")

          # This workflow alone carries the authorized artifacts. No separate binary/source
          # files need to be committed. Payload is inert base64 in YAML comments below.
          workflow = Path(".github/workflows/upload-azyron-draft-assets.yml").read_text()
          section = workflow.split("# AZYRON_PAYLOAD_BEGIN\n", 1)[1].split("# AZYRON_PAYLOAD_END", 1)[0]
          encoded = "".join(line.removeprefix("# ") for line in section.splitlines())
          pack = base64.b64decode(encoded, validate=True)
          check_bytes("Azyron-Modpack-1.0.3.mrpack", pack)
          with zipfile.ZipFile(io.BytesIO(pack)) as z:
              if z.testzip() is not None:
                  raise RuntimeError("MRPack CRC validation failed")
              jar = z.read("overrides/mods/Azyron-Client-1.0.3.jar")
              for mc in ("1.20.1", "1.21.11"):
                  index = json.loads(z.read(f"profiles/modrinth.index.{mc}.json"))
                  assert index["dependencies"]["minecraft"] == mc
          check_bytes("Azyron-Client-1.0.3.jar", jar)
          with zipfile.ZipFile(io.BytesIO(jar)) as z:
              if z.testzip() is not None:
                  raise RuntimeError("JAR CRC validation failed")
              mod = json.loads(z.read("fabric.mod.json"))
              assert mod["version"] == "1.0.3"
              assert mod["depends"]["minecraft"] == ["1.20.1", "1.21.11"]
              classes = [n for n in z.namelist() if n.endswith(".class")]
              assert len(classes) == 74
              assert all(struct.unpack(">H", z.read(n)[6:8])[0] == 61 for n in classes)

          release()  # No create/edit/publish/tag/push operations exist in this workflow.
          verified = []
          with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as temp:
              directory = Path(temp)
              for name, raw in (("Azyron-Client-1.0.3.jar", jar), ("Azyron-Modpack-1.0.3.mrpack", pack)):
                  path = directory / name
                  path.write_bytes(raw)
                  for attempt in range(1, 4):
                      try:
                          current = release()
                          matches = [a for a in current["assets"] if a["name"] == name]
                          if len(matches) > 1:
                              raise RuntimeError(f"Duplicate remote assets: {name}")
                          if not matches:
                              print(f"Uploading {name} (attempt {attempt}/3)", flush=True)
                              upload_exact(path)
                              matches = [a for a in release()["assets"] if a["name"] == name]
                          asset, = matches
                          if asset["state"] != "uploaded" or asset["size"] != EXPECTED[name]["size"]:
                              raise RuntimeError(f"Unexpected remote state/size: {name}")
                          digest = asset.get("digest")
                          if digest and digest != "sha256:" + EXPECTED[name]["sha256"]:
                              raise RuntimeError(f"Remote SHA-256 mismatch: {name}; refusing to replace it")
                          check_bytes(name, download_exact(asset))
                          print(f"VERIFIED: {name} SHA-256 {EXPECTED[name]['sha256']}", flush=True)
                          print(f"Asset URL: {asset['browser_download_url']}", flush=True)
                          verified.append(asset)
                          break
                      except (RuntimeError, subprocess.TimeoutExpired) as error:
                          print(f"Attempt {attempt} failed: {error}", flush=True)
                          if attempt == 3:
                              raise
                          time.sleep(attempt * 2)
          final = release()
          page_url = f"https://github.com/{REPO}/releases/tag/{TAG}"
          with urlopen(Request(page_url, headers={"User-Agent": "AZYRON-release-verifier"}), timeout=60) as response:
              if response.status != 200:
                  raise RuntimeError(f"Public release page HTTP {response.status}")
          for asset in verified:
              expected_url = f"https://github.com/{REPO}/releases/download/{TAG}/{asset['name']}"
              if asset["browser_download_url"] != expected_url:
                  raise RuntimeError("Noncanonical asset download URL")
              # NO Authorization header: test the exact public link that users receive.
              with urlopen(Request(expected_url, headers={"User-Agent": "AZYRON-release-verifier"}), timeout=120) as response:
                  if response.status != 200:
                      raise RuntimeError(f"Anonymous asset HTTP {response.status}")
                  check_bytes(asset["name"], response.read())
          assert len(verified) == 2
          for asset in verified:
              assert any(a["id"] == asset["id"] and a["state"] == "uploaded" for a in final["assets"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Both public release assets verified\n\n")
              summary.write("Versioned release and both direct asset links were fetched anonymously and SHA-256 verified.\n\n")
              summary.write("This is an upload-only workflow, not real Minecraft/Fabric gameplay validation.\n\n")
              for asset in verified:
                  summary.write(f"- [{asset['name']}]({asset['browser_download_url']}) — `{EXPECTED[asset['name']]['sha256']}`\n")
          print("SUCCESS: canonical public page and both anonymous downloads verified.")

# AZYRON_PAYLOAD_BEGIN
